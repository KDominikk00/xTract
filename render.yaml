services:
  - type: web
    name: xtract-stock-api
    runtime: python
    rootDir: stock-api
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.11
      - key: FMP_API_KEY
        sync: false
      - key: FRONTEND_ORIGINS
        value: https://xtract.top
      # Shared secret the web app (hosted on Vercel) sends as X-Stock-Api-Key.
      # Set the same value as STOCK_API_SECRET in the Vercel project settings.
      - key: STOCK_API_SECRET
        sync: false
